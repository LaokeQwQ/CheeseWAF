name: Bug report
description: Report a reproducible problem in CheeseWAF
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, tokens, private hostnames, or unpatched security details.
        Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
      description: CheeseWAF version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, deployment method, and relevant configuration (redacted)
    validations:
      required: true
