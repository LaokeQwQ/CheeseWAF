name: Semantic Evaluation Platform
run-name: Semantic Evaluation Platform

"on":
  pull_request:
    branches:
      - master
      - canary
      - dev
  push:
    branches:
      - master
      - canary
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-eval:
    name: semantic-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Evaluation Platform
        shell: bash
        env:
          FPR_GATE: "2.0"
          TPR_GATE: "98.0"
          EVAL_REPORT_PATH: "${{ github.workspace }}/artifacts/eval_report.json"
        run: |
          mkdir -p artifacts
          bash scripts/ci/go-env.sh go test -run TestEvaluationPlatform -short -v ./internal/engine/semantic/ -timeout 15m

      - name: Upload Evaluation Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-eval-report-${{ github.sha }}
          path: artifacts/eval_report.json
          if-no-files-found: warn
          retention-days: 30
