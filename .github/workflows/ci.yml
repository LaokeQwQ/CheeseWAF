name: CI
run-name: CI

"on":
  pull_request:
    branches:
      - master
      - canary
      - dev
  push:
    branches:
      - master
      - canary
      - dev
    tags:
      - 'Alpha-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-flow:
    name: branch-flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion path
        shell: bash
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          base="${PR_BASE_REF}"
          head="${PR_HEAD_REF}"

          case "$base" in
            master)
              if [[ "$head" != "canary" ]]; then
                echo "::error::master only accepts pull requests from canary."
                exit 1
              fi
              ;;
            canary)
              if [[ "$head" != "dev" ]]; then
                echo "::error::canary only accepts pull requests from dev."
                exit 1
              fi
              ;;
            dev)
              if [[ "$head" == "master" || "$head" == "canary" ]]; then
                echo "::error::dev cannot accept downward pull requests from master or canary."
                exit 1
              fi
              ;;
            *)
              echo "::error::protected pull requests must target dev, canary, or master."
              exit 1
              ;;
          esac

  ci-static:
    name: ci-static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify CI and release policy
        shell: bash
        run: bash scripts/ci/verify-ci-static.sh
      - name: Validate GitHub Actions workflows
        shell: bash
        run: bash scripts/ci/go-env.sh go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= -color .github/workflows/*.yml
      - name: Verify Ansible syntax
        shell: bash
        run: bash scripts/ci/verify-ansible.sh

  go-mod-tidy:
    name: go-mod-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go.mod and go.sum
        run: |
          bash scripts/ci/go-env.sh go mod tidy
          git diff --exit-code -- go.mod go.sum

  go-test:
    name: go-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        shell: bash
        run: bash scripts/ci/go-env.sh go test -race -short -count=1 ./cmd/... ./internal/...

  go-quality:
    name: go-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        shell: bash
        run: bash scripts/ci/verify-go-quality.sh format
      - name: Run go vet
        shell: bash
        run: bash scripts/ci/verify-go-quality.sh vet
      - name: Capture semantic request-path performance baseline
        shell: bash
        env:
          SEMANTIC_BENCH_TIME: 1s
          SEMANTIC_BENCH_COUNT: "3"
          SEMANTIC_BENCH_CPU: 1,4
          SEMANTIC_BENCH_OUTPUT: /tmp/cheesewaf-semantic-benchmark.json
        run: bash scripts/ci/run-semantic-benchmark.sh
      - name: Upload semantic performance baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-benchmark-${{ github.run_number }}-${{ github.sha }}
          path: /tmp/cheesewaf-semantic-benchmark.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce coverage floor
        shell: bash
        run: bash scripts/ci/verify-go-quality.sh coverage

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        # @agent-eyes postinstall runs `pnpm build`; published dist is usable without it.
        run: npm ci --ignore-scripts
      - name: Run CAPTCHA contract tests
        working-directory: web
        run: npm run test:captcha-contract
      - name: Install pinned coverage provider
        working-directory: web
        run: npm install --no-save --package-lock=false --ignore-scripts @vitest/coverage-v8@4.1.11
      - name: Run dashboard tests with coverage
        working-directory: web
        run: npm test -- --coverage
      - name: Verify coverage output
        working-directory: web
        shell: bash
        run: test -s coverage/coverage-summary.json
      - name: Typecheck dashboard
        working-directory: web
        run: npm run typecheck
      - name: Build dashboard
        working-directory: web
        run: npm run build

  go-vulncheck:
    name: go-vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan Go vulnerabilities
        run: bash scripts/ci/go-env.sh go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/... ./internal/...

  web-audit:
    name: web-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Audit web dependencies
        working-directory: web
        # Gate with documented allowlist (see web/scripts/npm-audit-gate.mjs).
        # Do not use bare `npm audit --audit-level=high` until React 19 + RR 8.3
        # lands; gated via npm-audit-gate allowlist until React 19 + RR 8.3 lands.
        run: node scripts/npm-audit-gate.mjs

  security-corpus:
    name: security-corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify corpus governance integrity
        env:
          CORPUS_GOVERNANCE_MAX_PARSE_ERRORS: "0"
          CORPUS_GOVERNANCE_MAX_INVALID_UTF8: "0"
          CORPUS_GOVERNANCE_MAX_OVERLONG: "0"
          CORPUS_GOVERNANCE_MAX_LABEL_CONFLICTS: "3"
          CORPUS_GOVERNANCE_MAX_REPAIRS: "127"
        run: bash scripts/ci/run-corpus-governance.sh
      - name: Smoke-test evaluation artifact first-capture lock
        shell: bash
        run: bash scripts/ci/lock-evaluation-artifact_test.sh
      - name: Smoke-test authorized blind-lab wiring
        shell: bash
        run: bash scripts/ci/run-authorized-blind-lab_test.sh
      - name: Replay and evaluate governed semantic snapshot
        env:
          FPR_GATE: "0.8"
          TPR_GATE: "99.0"
          FPR_MIN_BENIGN: "250"
          TPR_MIN_ATTACK: "10000"
        run: bash scripts/ci/run-governed-semantic-gate.sh

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all release targets
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          targets=(
            "linux/amd64"
            "linux/arm64"
            "linux/loong64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [[ "$goos" == "windows" ]]; then
              ext=".exe"
            fi
            output="bin/cheesewaf-${goos}-${goarch}${ext}"
            echo "building ${target} -> ${output}"
            GOOS="$goos" GOARCH="$goarch" bash scripts/ci/go-env.sh go build -trimpath -o "$output" ./cmd/cheesewaf/
          done

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build pinned container image
        shell: bash
        env:
          CHEESEWAF_DOCKER_PLATFORMS: linux/amd64,linux/arm64
        run: bash scripts/ci/docker-build.sh

  goreleaser-snapshot:
    name: goreleaser-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build GoReleaser snapshot
        shell: bash
        run: |
          export CHEESEWAF_VERSION_PREFIX="$(cat scripts/ci/product-version)"
          bash scripts/ci/go-env.sh go run github.com/goreleaser/goreleaser/v2@v2.17.0 release --snapshot --clean
      - name: Verify GoReleaser snapshot
        shell: bash
        env:
          CHEESEWAF_REQUIRE_SIGNING: warn
        run: bash scripts/ci/verify-release.sh dist

  release-package-smoke:
    name: release-package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Linux release package
        shell: bash
        env:
          CHEESEWAF_REF_NAME: ci
          CHEESEWAF_RUN_NUMBER: ${{ github.run_number }}
          CHEESEWAF_COMMIT: ${{ github.sha }}
          CHEESEWAF_TARGETS: linux/amd64
          CHEESEWAF_RELEASE_DIR: release-smoke
          CHEESEWAF_RELEASE_WORK_DIR: tmp/release-smoke
        run: bash scripts/ci/go-env.sh bash scripts/ci/package-release.sh
      - name: Verify release package
        shell: bash
        env:
          CHEESEWAF_REQUIRE_SIGNING: warn
        run: bash scripts/ci/verify-release.sh release-smoke

  release-artifacts:
    name: release-artifacts
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'canary' || github.ref_name == 'master'))
    runs-on: ubuntu-latest
    needs:
      - go-mod-tidy
      - go-test
      - go-quality
      - web-build
      - go-vulncheck
      - web-audit
      - security-corpus
      - cross-build
      - ci-static
      - docker-build
      - goreleaser-snapshot
      - release-package-smoke
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis zip osslsigncode
      - name: Package branch release artifacts
        shell: bash
        env:
          CHEESEWAF_REF_NAME: ${{ github.ref_name }}
          CHEESEWAF_RUN_NUMBER: ${{ github.run_number }}
          CHEESEWAF_COMMIT: ${{ github.sha }}
          # Branch artifacts stay available without signing credentials. Only tag-triggered packaging can resolve them.
          WINDOWS_CERT_P12: ${{ github.ref_type == 'tag' && secrets.WINDOWS_CERT_P12 || '' }}
          WINDOWS_CERT_PASSWORD: ${{ github.ref_type == 'tag' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: bash scripts/ci/go-env.sh bash scripts/ci/package-release.sh
      - name: Verify branch release artifacts
        shell: bash
        env:
          WINDOWS_CERT_P12: ${{ github.ref_type == 'tag' && secrets.WINDOWS_CERT_P12 || '' }}
        run: |
          signing_mode=warn
          if [[ -n "$WINDOWS_CERT_P12" ]]; then signing_mode=1; fi
          CHEESEWAF_REQUIRE_SIGNING="$signing_mode" CHEESEWAF_SIGNING_SCOPE=windows \
            bash scripts/ci/verify-release.sh release
      - name: Upload branch release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesewaf-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  package-macos-dmg:
    name: package-macos-dmg
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'canary' || github.ref_name == 'master'))
    runs-on: macos-latest
    needs:
      - release-artifacts
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download branch release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesewaf-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          path: release
      - name: Build macOS disk images
        shell: bash
        env:
          # Branch artifacts stay available without signing credentials. Only tag-triggered packaging can resolve them.
          MACOS_P12_BASE64: ${{ github.ref_type == 'tag' && secrets.MACOS_P12_BASE64 || '' }}
          MACOS_P12_PASSWORD: ${{ github.ref_type == 'tag' && secrets.MACOS_P12_PASSWORD || '' }}
          MACOS_CODESIGN_IDENTITY: ${{ github.ref_type == 'tag' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          APPLE_API_KEY: ${{ github.ref_type == 'tag' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.ref_type == 'tag' && secrets.APPLE_API_ISSUER || '' }}
        run: bash scripts/ci/package-macos-dmg.sh release
      - name: Verify macOS disk images
        shell: bash
        env:
          MACOS_P12_BASE64: ${{ github.ref_type == 'tag' && secrets.MACOS_P12_BASE64 || '' }}
          MACOS_CODESIGN_IDENTITY: ${{ github.ref_type == 'tag' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          APPLE_API_KEY: ${{ github.ref_type == 'tag' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.ref_type == 'tag' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          signing_mode=warn
          if [[ -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]] && \
             [[ -n "$MACOS_P12_BASE64" || -n "$MACOS_CODESIGN_IDENTITY" ]]; then
            signing_mode=1
          fi
          CHEESEWAF_REQUIRE_SIGNING="$signing_mode" CHEESEWAF_SIGNING_SCOPE=macos \
            bash scripts/ci/verify-release.sh release
      - name: Upload macOS disk images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesewaf-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}-dmg
          path: |
            release/*.dmg
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: publish-prerelease
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'master' || github.ref_name == 'canary')
    runs-on: ubuntu-latest
    environment: publish-prerelease
    needs:
      - release-artifacts
      - package-macos-dmg
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download branch release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesewaf-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          path: release
      - name: Download macOS disk images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesewaf-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}-dmg
          path: release
      - name: Install syft
        run: bash scripts/ci/install-syft.sh
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-prerelease.sh release

  publish-release:
    name: publish-release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: publish-release
    needs:
      - release-artifacts
      - package-macos-dmg
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesewaf-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          path: release
      - name: Download macOS disk images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cheesewaf-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}-dmg
          path: release
      - name: Install syft
        run: bash scripts/ci/install-syft.sh
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-release.sh release
