---
- name: CheeseWAF single-node temporary deployment
  hosts: cheesewaf
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    cheesewaf_deployment_entrypoint: single-node
    cheesewaf_storage_profile: temporary
    cheesewaf_management_postgresql_mode: none
    cheesewaf_control_postgresql_mode: none
    cheesewaf_redis_mode: none
    cheesewaf_consensus_backend: builtin
    cheesewaf_provision_only: false
  pre_tasks:
    - name: Load deployment defaults without overriding entrypoint or secret vars
      ansible.builtin.import_tasks: tasks/defaults.yml
    - name: Validate single-node contract
      ansible.builtin.import_tasks: tasks/preflight.yml
  tasks:
    - name: Apply optional local host preparation
      ansible.builtin.import_tasks: tasks/bootstrap.yml
      when: cheesewaf_prepare_host | bool or cheesewaf_cwedp_agent_enabled | bool
  handlers:
    - name: Reload systemd after CheeseWAF unit changes
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Restart CWEDP pull agent after an intentional change
      ansible.builtin.systemd_service:
        name: cheesewaf-cwedp-agent
        state: restarted
      when: cheesewaf_cwedp_agent_start | bool
