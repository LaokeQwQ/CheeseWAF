deployment:
    mode: standalone
server:
    listen: 127.0.0.1:8080
    listen_tls: ""
    listen_http3: ""
    admin_listen: 127.0.0.1:9443
    admin_public: false
    admin_tls:
        enabled: false
        cert_file: /Users/laoke/Dev/CheeseWAF/data/certs/admin.crt
        key_file: /Users/laoke/Dev/CheeseWAF/data/certs/admin.key
        self_signed: false
    read_timeout: 10s
    write_timeout: 30s
    idle_timeout: 1m0s
    http3:
        enabled: false
        zero_rtt: false
time_sync:
    enabled: true
    sources:
        - time.cloudflare.com
        - time.google.com
        - time.aws.com
        - time.apple.com
        - ntp.aliyun.com
        - time1.cloud.tencent.com
        - ntp.ubuntu.com
        - pool.ntp.org
    selection_interval: 24h0m0s
    sync_interval: 30m0s
    timeout: 2s
    samples_per_source: 3
    max_accepted_offset: 5m0s
    max_root_dispersion: 2s
    consensus_tolerance: 250ms
tls:
    auto_cert: false
    cert_file: /Users/laoke/Dev/CheeseWAF/data/certs/admin.crt
    key_file: /Users/laoke/Dev/CheeseWAF/data/certs/admin.key
    min_version: "1.3"
    hsts: true
setup:
    data_dir: /Users/laoke/Dev/CheeseWAF/data
    runtime_dir: /Users/laoke/Dev/CheeseWAF/data/run
    three_end_unified: true
cluster:
    enabled: false
    cluster_id: ""
    node_id: ""
    ha_mode: single-node
    ssh:
        # Deliberate self-hosted opt-in: permits RFC1918 and IPv6 ULA deployment targets only.
        allow_private_targets: false
    interconnect:
        listen: 127.0.0.1:9444
        advertise_addr: ""
        mtls_required: true
        ca_file: ""
        cert_file: ""
        key_file: ""
    consensus:
        provider: builtin
        etcd_endpoints: []
    join:
        require_approval: true
        token_ttl: 15m0s
    nodes: []
    protection:
        freeze_writes_without_majority: true
        allow_traffic_in_protection_mode: true
console:
    login:
        captcha:
            enabled: true
            mode: slider
            max_number: 75000
            ttl: 2m0s
            slider:
                width: 320
                height: 150
                piece_size: 42
                tolerance: 6
                min_drag: 450ms
                pow_enabled: false
                pow_max_number: 12000
        security_entry:
            enabled: false
            path: /__cheesewaf-entry
            cookie_name: cheesewaf_admin_entry
        background:
            enabled: false
            type: auto
            url: ""
        copyright: Copyright © CheeseWAF. All rights reserved.
        show_product_version: true
    map:
        china_boundary:
            enabled: false
            source_type: file
            source: ""
            license: ""
            review_id: ""
            attribution: ""
            allow_insecure: false
            allow_private: false
captcha_assets:
    backend: local
    local:
        path: /Users/laoke/Dev/CheeseWAF/data/captcha-assets
    s3:
        endpoint: ""
        bucket: ""
        region: us-east-1
        path_style: false
        prefix: ""
        use_tls: true
        allow_private_endpoint: false
        credential_file: ""
        metadata_key_file: ""
        request_timeout: 15s
    limits:
        max_image_bytes: 8388608
        max_font_bytes: 16777216
        max_pixels: 16000000
        max_assets: 512
        max_total_bytes: 536870912
sites:
    - id: default
      name: localhost
      domains:
        - localhost
        - 127.0.0.1
      upstreams:
        - address: 127.0.0.1:9000
          weight: 1
      listen_port: 80
      loadbalance: round_robin
      enable_ssl: false
      certificate:
        mode: file
        auto_renew: false
        force_https: false
        hsts: false
        min_tls_version: "1.2"
        acme:
            provider_id: ""
            dns_api: ""
            account_email: ""
            server: ""
            key_type: ""
            acme_sh_path: ""
            home: ""
            cert_dir: ""
            reload_command: ""
            domains: []
            env: {}
            notify: false
      waf:
        enabled: true
        mode: block
        paranoia_level: 3
        semantic_engines:
            sql: true
            xss: true
            rce: true
            lfi: true
            xxe: true
            ssrf: true
            nosql: true
            ssti: true
        semantic_policy:
            budget_exhausted_policy: auto
            decode_depth: 6
            path_allowlist: []
            param_allowlist: []
            promote_seconds: 0
            auto_agree: false
            fingerprint_deny: []
        protection_policy:
            web_attack: ""
            api_security: ""
            bot_cc: ""
            threat_intel: ""
        custom_rules:
            - id: block-admin-probe
              name: Admin path probe
              pattern: (?i)/(wp-admin|phpmyadmin|\.git)
              location: uri
              action: block
              severity: medium
              enabled: true
              priority: 180
        performance:
            max_body_bytes: 8388608
            max_header_bytes: 1048576
            proxy_timeout: 30s
        response:
            enabled: true
            max_body_bytes: 1048576
            sensitive_patterns:
                - AKIA[0-9A-Z]{16}
                - (?i)password\s*[=:]\s*['\"]?[^'\"\s]+
                - (?i)secret[_-]?key\s*[=:]\s*['\"]?[^'\"\s]+
        rewrite:
            - id: legacy-api
              pattern: ^/v1/(.*)$
              replacement: /api/$1
              redirect_code: 0
              enabled: false
        health_check:
            enabled: true
            path: /
            interval: 30s
            timeout: 3s
            healthy_threshold: 2
            unhealthy_threshold: 2
        access_control:
            auth_enabled: false
            waiting_room: false
            dynamic_guard: true
            trusted_cidrs: []
      enabled: true
protection:
    policy:
        web_attack: smart
        api_security: smart
        bot_cc: smart
        threat_intel: smart
    ip:
        blacklist: []
        whitelist:
            - 127.0.0.1
            - ::1
        access_rules: []
        reputation_overrides: {}
        geoip:
            enabled: false
            database: /Users/laoke/Dev/CheeseWAF/data/GeoLite2-Country.mmdb
            precision_database: ""
            blocked_countries: []
            country_cidrs: {}
        tags: {}
        threat_intel: []
        providers: []
    ratelimit:
        enabled: true
        default:
            requests: 100
            window: 1m0s
            burst: 20
    bot:
        enabled: false
        challenge_backend: memory
        risk_level: 2
        risk_low_threshold: 35
        risk_medium_threshold: 55
        risk_high_threshold: 75
        risk_block_threshold: 95
        risk_confidence_min: 0.6
        js_challenge: true
        captcha: false
        captcha_type: pow
        captcha_types:
            - pow
            - shape_slider
            - rotate
            - text_click
        captcha_challenge_ttl: 2m0s
        captcha_failure_window: 10m0s
        captcha_block_duration: 15m0s
        captcha_escalation_types:
            - pow
            - shape_slider
            - text_click
        captcha_binding_mode: strict_ip_ua
        captcha_policy_version: "1"
        captcha_max_attempts: 5
        image_captcha_length: 6
        image_captcha_width: 220
        image_captcha_height: 86
        image_captcha_audio_limit: 6
        slider_captcha_width: 320
        slider_captcha_height: 150
        slider_captcha_piece: 42
        slider_captcha_tolerance: 6
        slider_captcha_min_drag: 450ms
        slider_captcha_track_required: true
        captcha_mobile_type: pow
        challenge_difficulty: 4
        altcha_max_number: 75000
        altcha_header_name: X-CheeseWAF-Altcha
        clearance_header_enabled: false
        clearance_header_name: X-CheeseWAF-Clearance
        clearance_method_scope: false
        clearance_state_capacity: 20000
        pow_max_difficulty: 6
        pow_accept_legacy: false
        clearance_accept_legacy: false
        waiting_room: false
        waiting_room_max_active: 1000
        waiting_room_ttl: 5m0s
        challenge_ttl: 30m0s
        cookie_name: cheesewaf_js_clearance
        secret: HZaV0XD3NNKDe5JOMVE3rN7nYkIiTc6GbesEgKsibfs
        path_prefixes:
            - /
        exempt_path_prefixes:
            - /health
        allowed_user_agents: []
        suspicious_user_agents:
            - curl
            - python-requests
            - sqlmap
            - nikto
            - nuclei
            - masscan
            - zgrab
            - httpclient
    acl:
        enabled: true
        rules:
            - id: deny-debug
              name: Deny debug endpoints
              method: ""
              path_prefix: /debug
              header: ""
              header_value: ""
              action: block
              severity: high
              enabled: true
