edge:
    headers:
        enabled: true
        rules:
            - id: set-edge-marker
              name: Set edge marker
              operation: set
              header: X-CheeseWAF
              value: edge
              path_prefix: ""
              enabled: true
            - id: remove-origin-leak
              name: Remove origin leak header
              operation: delete
              header: X-Origin-Secret
              value: ""
              path_prefix: ""
              enabled: true
    cache:
        enabled: true
        mode: public
        ttl: 5m0s
        status_codes:
            - 200
            - 304
        path_prefixes:
            - /assets/
            - /static/
        max_body_bytes: 2097152
    compression:
        enabled: true
        algorithms:
            - br
            - gzip
        level: 5
        min_bytes: 1024
        content_types:
            - text/
            - application/json
            - application/javascript
            - application/xml
            - image/svg+xml
monitor:
    prometheus:
        enabled: true
        path: /metrics
        public: false
    remote_write:
        enabled: false
        endpoint: ""
        allow_private_endpoint: false
        interval: 1m0s
        timeout: 10s
    alerts:
        enabled: true
        rules:
            - id: high-block-rate
              name: High block rate
              metric: cheesewaf_blocked_total
              operator: '>'
              threshold: 100
              for: 5m0s
              cooldown: 0s
              severity: high
              enabled: true
            - id: disk-usage
              name: Disk usage high
              metric: cheesewaf_disk_usage_bytes:data
              operator: '>'
              threshold: 1.073741824e+10
              for: 10m0s
              cooldown: 0s
              severity: medium
              enabled: true
