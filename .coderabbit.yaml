# Keep automated reviews enabled for every protected promotion branch. The
# repository default branch is included automatically; these entries extend
# coverage to the development and canary promotion stages as well. The review
# provider caps a run at 100 files, so select the production/security paths
# here; the excluded fixtures and tests remain enforced by CI.
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^dev$"
      - "^canary$"
      - "^master$"
  path_filters:
    - "internal/engine/semantic/**"
    - "internal/security/**"
    - "internal/config/**"
    - "internal/engine/budget_metrics.go"
    - "internal/engine/context.go"
    - "internal/engine/pipeline.go"
    - "internal/engine/sandbox.go"
    - "internal/engine/types.go"
    - "scripts/ci/**"
    - "deploy/docker/**"
    - ".github/workflows/**"
    - ".forgejo/workflows/**"
    - "configs/**"
    - "web/scripts/**"
    - "web/vite.config.ts"
    - "web/package.json"
    - "README_CN.md"
    - ".coderabbit.yaml"
    - "web/package-lock.json"
    - "!**/*_test.go"
    - "!**/*_test.sh"
    - "!**/*_test.py"
    - "!internal/engine/semantic/testdata/**"
    - "!**/go.sum"
    - "!**/*.png"
    - "!**/*.ico"
    - "!**/*.icns"
